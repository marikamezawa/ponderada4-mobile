name: reggieapp
description: "ReggieApp — Diário Inteligente de Plantas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend / BaaS
  supabase_flutter: ^2.0.0

  # Estado
  riverpod: ^2.0.0
  flutter_riverpod: ^2.0.0

  # Navegação
  go_router: ^13.0.0

  # HTTP
  dio: ^5.0.0

  # Câmera / Imagem
  image_picker: ^1.0.0

  # Notificações
  flutter_local_notifications: ^17.0.0

  # Compartilhamento
  share_plus: ^9.0.0

  # Armazenamento local
  shared_preferences: ^2.0.0

  # Utilitários
  intl: ^0.19.0
  cached_network_image: ^3.0.0
  uuid: ^4.0.0
  permission_handler: ^11.0.0
  path_provider: ^2.0.0

  # Banco de dados local
  sqflite: ^2.0.0
  sqflite_common_ffi: ^2.0.0
  path: ^1.8.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
